<title>Barbearia Ceribelli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A; --card:#141414; --modal:#181818; --border:#252525; --border2:#2E2E2E;
    --gold:#C9A84C; --gold-l:#E8C870; --gold-m:#7A6030;
    --green:#22C55E; --green-bg:#052E16; --red:#EF4444; --red-bg:#2D0808;
    --amber:#F59E0B; --amber-bg:#2D1B00; --blue:#60A5FA; --blue-bg:#0D1B2E;
    --text:#F5F5F5; --text-2:#9CA3AF; --text-3:#6B7280;
    --surface:#141414; --inp-bg:#0F0F0F; --inner:#0F0F0F;
  }
  body.tema-claro{
    --bg:#F2F2EE; --card:#FFFFFF; --modal:#FFFFFF; --border:#E0E0D8; --border2:#D0D0C8;
    --text:#1A1A1A; --text-2:#5A5A5A; --text-3:#8A8A8A;
    --surface:#FFFFFF; --inp-bg:#F8F8F4; --inner:#F0F0EC;
    --green-bg:#DCFCE7; --red-bg:#FEE2E2; --amber-bg:#FEF3C7; --blue-bg:#DBEAFE;
    --gold-m:#B8922A;
  }
  body.tema-claro ::-webkit-scrollbar-thumb{background:#C8C8C0}
  body.tema-claro #sidebar{background:#1A1A1A}
  body.tema-claro .card{box-shadow:0 1px 4px rgba(0,0,0,.07)}
  body.tema-claro #topbar{background:rgba(240,240,236,.97)}
  body.tema-claro .modal{box-shadow:0 8px 32px rgba(0,0,0,.15)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:'DM Sans','Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#2A2A2A;border-radius:4px}

  /* ===== LAYOUT ===== */
  #app{display:flex;min-height:100vh;min-height:100dvh}

  /* Sidebar desktop (rail de 70px) */
  #sidebar{
    width:70px; flex-shrink:0; background:#0D0D0D; border-right:1px solid var(--border);
    display:flex; flex-direction:column; align-items:center; padding:14px 0; gap:2px;
    position:sticky; top:0; height:100vh; height:100dvh; z-index:50;
  }
  .side-logo{width:38px;height:38px;border-radius:50%;
    background:linear-gradient(135deg,var(--gold),var(--gold-m));
    display:flex;align-items:center;justify-content:center;margin-bottom:18px}
  .nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;width:54px;
    padding:9px 6px;border-radius:10px;background:transparent;border:1px solid transparent;
    color:var(--text-3);transition:all .2s}
  .nav-btn span{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .nav-btn.active{background:rgba(201,168,76,.1);border-color:rgba(201,168,76,.2);color:var(--gold)}
  .nav-btn .lbl-full{display:none}
  .side-head{display:none}

  /* Backdrop (só mobile) */
  #backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1100;
    opacity:0;pointer-events:none;transition:opacity .3s ease}
  #backdrop.show{opacity:1;pointer-events:auto}

  /* Main */
  main{flex:1;min-width:0;width:100%;overflow-y:auto}
  #topbar{
    display:flex;align-items:center;gap:10px;
    padding:10px 20px;
    padding-top:max(10px, env(safe-area-inset-top));
    position:sticky;top:0;z-index:900;
    background:rgba(13,13,13,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border)
  }
  #topbar .burger{display:none}
  #topbar .brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
  #topbar .brand span{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #topbar .top-action{background:none;border:1px solid var(--border);border-radius:9px;padding:8px;color:var(--gold);display:flex;align-items:center;position:relative;flex-shrink:0;cursor:pointer}
  #topbar .top-action:hover{background:rgba(201,168,76,.08)}
  #lembrete-badge{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:9px;font-weight:700;display:none;align-items:center;justify-content:center;line-height:16px}
  #view{padding:22px}

  /* ===== COMPONENTES ===== */
  .sec-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;gap:12px}
  .sec-head h1{font-size:22px;font-weight:700}
  .sec-head p{color:var(--text-2);font-size:12px;margin-top:3px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
  .btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--text-2);transition:opacity .15s}
  .btn:hover{opacity:.85}
  .btn-sm{padding:5px 10px;font-size:11px}
  .btn-primary{background:var(--gold);border-color:var(--gold);color:#0A0A0A}
  .btn-green{background:var(--green-bg);border-color:var(--green);color:var(--green)}
  .btn-red{background:var(--red-bg);border-color:var(--red);color:var(--red)}
  .btn-amber{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
  .inp{width:100%;padding:10px 14px;background:var(--inp-bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;transition:border-color .15s}
  .inp:focus{border-color:var(--gold);border-width:1.5px}
  .lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--text-3);text-transform:uppercase;margin-bottom:6px}
  .field{margin-bottom:14px}
  select.inp{appearance:none;cursor:pointer}
  textarea.inp{resize:vertical;min-height:60px}
  .badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.05em;display:inline-block}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .empty{text-align:center;padding:48px;color:var(--text-3)}
  .empty p{margin:12px 0 16px;font-size:14px}
  .list-item{margin-bottom:10px}
  .actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;background:var(--inner);border:1px solid var(--border);border-radius:20px;font-size:12px}
  .chip button{background:none;border:none;color:var(--red);font-size:14px;line-height:1;padding:0}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:1300;padding:16px}
  .modal{background:var(--modal);border:1px solid var(--border2);border-radius:16px;padding:24px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .modal-head h2{font-size:18px;font-weight:700}
  .modal-head button{background:none;border:none;color:var(--text-3)}
  .modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

  /* Toggle entrada/saida + pagamento */
  .toggle-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
  .toggle{padding:10px;border-radius:8px;border:2px solid var(--border);background:transparent;color:var(--text-3);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}

<script>
/* ============ STORAGE (localStorage com fallback em memória) ============ */
const LS = {
  mem:{},
  get(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return this.mem[k]||null; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ this.mem[k]=v; } }
};

/* ============ FIREBASE (NUVEM PRINCIPAL) ============ */
const firebaseConfig = {

/* ============ SUPABASE (NUVEM ALTERNATIVA — opcional) ============ */
// Após criar sua conta no supabase.com, cole aqui o URL e a chave anon do seu projeto:
const SB_URL = ''; // ex: https://xyzabc.supabase.co
const SB_KEY = ''; // ex: eyJhbGciOiJIUzI1NiIsInR5...

const cloudAtivo = () => !!db || (SB_URL && SB_URL.length > 10);
const sbHeaders = () => ({'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'});

function setCloudStatus(msg, cor){
  let el=document.getElementById('cloud-status');
  if(!el){ el=document.createElement('div'); el.id='cloud-status';
    el.style.cssText='position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#141414;border:1px solid #252525;font-size:11px;padding:5px 14px;border-radius:20px;z-index:2000;white-space:nowrap;pointer-events:none';
    document.body.appendChild(el); }
  el.textContent=msg; el.style.color=cor||'#9CA3AF';
  clearTimeout(el._t); el._t=setTimeout(()=>{ const e=document.getElementById('cloud-status'); if(e)e.remove(); },3000);
}

async function cloudSave(key, valor){
  if(!cloudAtivo()) return;
  try{
    await fetch(SB_URL+'/rest/v1/dados',{method:'POST',headers:{...sbHeaders(),'Prefer':'resolution=merge-duplicates'},body:JSON.stringify({id:key,valor})});
  }catch(e){ console.warn('Supabase save:',e); }
}
async function cloudLoad(){
  if(!cloudAtivo()) return false;
  try{
    const r=await fetch(SB_URL+'/rest/v1/dados?select=*',{headers:sbHeaders()});
    if(!r.ok) return false;
    const rows=await r.json();
    if(!rows.length) return false;
    rows.forEach(row=>{
      if(row.id==='config'){ if(row.valor) state.config=row.valor; }
      else if(row.id==='notas'){ if(row.valor!==undefined) state.notas=row.valor; }
      else if(row.valor!==null&&row.valor!==undefined) state[row.id]=row.valor;
    });
    migrarDados();
    ['clientes','agendamentos','lancamentos','produtos','lembretesEnviados','notifAlteracao','pacotes'].forEach(k=>LS.set('bc:'+k,state[k]));
    LS.set('bc:config',state.config);
    LS.set('bc:notas',state.notas);
    return true;
  }catch(e){ console.warn('Supabase load:',e); return false; }
}

/* ============ HELPERS ============ */
const uid = () => Math.random().toString(36).slice(2,10);
const fmtMoney = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const fmtDate = d => { if(!d) return ''; const [y,m,day]=d.split('-'); return `${day}/${m}/${y}`; };
const todayStr = () => new Date().toISOString().split('T')[0];
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const calcLiquido = (v,fp) => fp==='debito'?v*(1-state.config.taxaDebito/100):fp==='credito'?v*(1-state.config.taxaCredito/100):v;
const fmtPayment = fp => ({pix:'Pix',dinheiro:'Dinheiro',debito:`Débito (−${state.config.taxaDebito}%)`,credito:`Crédito (−${state.config.taxaCredito}%)`}[fp]||fp);

/* Telefone -> formato wa.me (só dígitos, com 55) */
function limparTelefone(tel){
  let d = String(tel||'').replace(/\D/g,'');
  if(d.length===10 || d.length===11) d = '55'+d;
  return d;
}
/* Substitui variáveis do template pelos dados do agendamento */
function montarMensagem(tpl, a){
  return (tpl||'')
    .replace(/\{nome\}/g, a.clienteNome||'')
    .replace(/\{hora\}/g, a.hora||'')
    .replace(/\{data\}/g, fmtDate(a.data)||'')
    .replace(/\{servico\}/g, a.servico||'')
    .replace(/\{barbeiro\}/g, a.barbeiro||'');
}
function abrirWhatsApp(tel, msg){
  const num = limparTelefone(tel);
  if(!num){ alert('Cliente sem telefone cadastrado.'); return; }
  window.open('https://wa.me/'+num+'?text='+encodeURIComponent(msg), '_blank');
}
/* Preço de um serviço pelo nome */
function servicoPreco(nome){
  const s = (state.config.servicos||[]).find(x=>x && x.nome===nome);
  return s ? (s.preco||0) : 0;
}
function servicoDuracao(nome){
  const s = (state.config.servicos||[]).find(x=>x && x.nome===nome);
  return s ? (s.duracao||0) : 0;
}
/* Datas (formato local YYYY-MM-DD) */
function parseLocalDate(s){ const [y,m,d]=String(s).split('-').map(Number); return new Date(y,m-1,d); }
function toISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function weekDays(refISO){
  const d=parseLocalDate(refISO); const dow=(d.getDay()+6)%7; // 0=segunda
  const seg=new Date(d); seg.setDate(d.getDate()-dow);
  const arr=[]; for(let i=0;i<7;i++){ const x=new Date(seg); x.setDate(seg.getDate()+i); arr.push(toISO(x)); }
  return arr;
}
function countAgDia(iso){ return state.agendamentos.filter(a=>a.data===iso && a.status!=='cancelado').length; }
function demandaBg(n){ if(n===0)return 'transparent'; if(n<=2)return 'rgba(201,168,76,0.15)'; if(n<=4)return 'rgba(201,168,76,0.40)'; return 'rgba(201,168,76,0.68)'; }
function weekStrip(){
  const dias=weekDays(agFiltro); const nomes=['SEG','TER','QUA','QUI','SEX','SÁB','DOM'];
  const prev=toISO(new Date(parseLocalDate(agFiltro).getTime()-7*86400000));

  return `<div class="card" style="padding:14px;margin-bottom:16px">

      ${dias.map((iso,i)=>{ const n=countAgDia(iso); const sel=iso===agFiltro; const hoje=iso===todayStr(); const dnum=parseLocalDate(iso).getDate();
        return `<button onclick="agFiltro='${iso}';render()" style="border:1px solid ${sel?'var(--gold)':(hoje?'var(--text-3)':'var(--border)')};background:${demandaBg(n)};border-radius:8px;padding:7px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px">
          <span style="font-size:9px;color:var(--text-3);font-weight:700">${nomes[i]}</span>
          <span style="font-size:15px;font-weight:700;color:${sel?'var(--gold)':'var(--text)'}">${dnum}</span>
          <span style="font-size:9px;font-weight:700;color:${n>0?'var(--gold)':'var(--text-3)'}">${n>0?n:'—'}</span>

    </div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:10px;font-size:10px;color:var(--text-3)">
      <span style="display:flex;align-items:center;gap:4px"><span style="width:11px;height:11px;border-radius:3px;background:rgba(201,168,76,0.15)"></span>tranquilo</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:11px;height:11px;border-radius:3px;background:rgba(201,168,76,0.40)"></span>médio</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:11px;height:11px;border-radius:3px;background:rgba(201,168,76,0.68)"></span>cheio</span>
    </div>
  </div>`;
}
/* Migra dados antigos para os novos formatos, sem perder nada */
function migrarDados(){
  const c = state.config;
  c.servicos = Array.isArray(c.servicos) ? c.servicos.map(s=> typeof s==='string' ? {nome:s, preco:0, duracao:30} : {duracao:30, ...s}) : [];
  if(!c.confirmacao) c.confirmacao = 'Olá {nome}! ✅ Seu horário na Barbearia Ceribelli está confirmado para {data} às {hora} ({servico}). Qualquer coisa, é só chamar!';
  if(!c.msgAlteracao) c.msgAlteracao = 'Olá {nome}! ⚠️ Seu horário foi alterado. O novo horário é {data} às {hora} para {servico}. Qualquer dúvida, é só chamar! ✂️';
  if(!Array.isArray(c.lembretes)) c.lembretes = [];
  if(!Array.isArray(state.lembretesEnviados)) state.lembretesEnviados = [];
  if(!Array.isArray(state.notifAlteracao)) state.notifAlteracao = [];
  if(typeof state.notas !== 'string') state.notas = '';
  if(!c.metaMensal) c.metaMensal = 0;
  if(!c.comissoes) c.comissoes = {};
  if(!Array.isArray(c.despesasFixas)) c.despesasFixas = [];
  if(c.pinHash===undefined) c.pinHash = '';
  if(!Array.isArray(state.pacotes)) state.pacotes = [];
  if(!c.msgPacoteRenovado) c.msgPacoteRenovado='Olá {nome}! 🎉 Seu pacote *{pacote}* do mês de {mes} foi renovado com sucesso!\n💈 Valor: {valor}\nObrigado pela confiança! Qualquer dúvida é só chamar. ✂️';
}

async function importarContato(campoNome, campoTel){
  const isIOS=/iPhone|iPad/i.test(navigator.userAgent);
  if(isIOS){
    alert('📱 No iPhone, use o teclado para buscar contatos:\n\n1. Toque no campo "Nome Completo"\n2. O QuickType (barra acima do teclado) vai sugerir contatos\n3. Toque no nome para preencher automaticamente\n\nOs campos já estão configurados para reconhecer seus contatos!');
    return;
  }
  if(!navigator.contacts||!navigator.contacts.select){
    alert('Importação direta de contatos não disponível neste navegador.\n\nFunciona no Chrome para Android.');
    return;
  }
  try{
    const [c]=await navigator.contacts.select(['name','tel'],{multiple:false});
    if(!c) return;
    const nomeEl=document.getElementById(campoNome); if(nomeEl) nomeEl.value=(c.name&&c.name[0])||'';
    const telEl=document.getElementById(campoTel); if(telEl) telEl.value=(c.tel&&c.tel[0])||'';
  }catch(e){ console.warn('Contato:',e); }
}

function comprimirFoto(dataUrl){ return new Promise(res=>{ const img=new Image(); img.onload=()=>{ const MAX=600; let w=img.width,h=img.height; if(w>MAX){h=Math.round(h*MAX/w);w=MAX;} const c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); res(c.toDataURL('image/jpeg',0.65)); }; img.src=dataUrl; }); }

/* ============ PIN / AUTENTICAÇÃO ============ */
let _pinAtual='', _pinErro='';
async function hashPin(p){ const d=new TextEncoder().encode(p+':bc-ceribelli-2024'); const h=await crypto.subtle.digest('SHA-256',d); return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
function sessionValida(){ const s=LS.get('bc:session'); return !!(s&&s.pinHash&&s.expires&&Date.now()<s.expires&&s.pinHash===state.config.pinHash); }
function pinRequired(){ return !!(state.config.pinHash)&&!sessionValida(); }
function lockApp(){ LS.set('bc:session',null); _pinAtual=''; _pinErro=''; render(); }
function viewPin(){
  return `<div style="text-align:center;width:100%;max-width:320px">
    <div class="side-logo" style="margin:0 auto 16px;width:60px;height:60px">${ICON.scissors(24,'#0A0A0A')}</div>
    <h1 style="font-size:20px;font-weight:700;margin-bottom:4px">${esc(state.config.barbearia?.nome||'Barbearia')}</h1>
    <p style="font-size:13px;color:var(--text-3);margin-bottom:28px">Digite seu PIN para entrar</p>
    <div style="display:flex;gap:16px;justify-content:center;margin-bottom:${_pinErro?'14px':'28px'}">
      ${[0,1,2,3].map(i=>`<div class="pin-dot ${_pinAtual.length>i?'filled':''}" id="pd-${i}"></div>`).join('')}
    </div>
    ${_pinErro?`<p style="color:var(--red);font-size:13px;margin-bottom:20px">${_pinErro}</p>`:''}
    <div style="display:grid;grid-template-columns:repeat(3,74px);gap:12px;justify-content:center">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="kp-btn" onclick="pinDigito('${n}')">${n}</button>`).join('')}
      <div class="kp-empty"></div>
      <button class="kp-btn" onclick="pinDigito('0')">0</button>
      <button class="kp-btn" style="font-size:18px" onclick="pinApagar()">⌫</button>
    </div>
  </div>`;
}
function pinDigito(d){
  if(_pinAtual.length>=4) return;
  _pinAtual+=d; _pinErro='';
  for(let i=0;i<4;i++){const el=document.getElementById('pd-'+i);if(el){el.classList.toggle('filled',_pinAtual.length>i);el.classList.remove('erro');}}
  if(_pinAtual.length===4) setTimeout(pinVerificar,150);
}
function pinApagar(){ if(_pinAtual.length>0){_pinAtual=_pinAtual.slice(0,-1);for(let i=0;i<4;i++){const el=document.getElementById('pd-'+i);if(el)el.classList.toggle('filled',_pinAtual.length>i);}}}
async function pinVerificar(){
  const h=await hashPin(_pinAtual);
  if(h===state.config.pinHash){
    LS.set('bc:session',{pinHash:state.config.pinHash,expires:Date.now()+30*24*60*60*1000});
    _pinAtual='';_pinErro='';
    const ov=document.getElementById('pin-overlay'); if(ov) ov.style.display='none';
    render();
  } else {
    _pinErro='PIN incorreto. Tente novamente.';_pinAtual='';
    for(let i=0;i<4;i++){const el=document.getElementById('pd-'+i);if(el){el.classList.remove('filled');el.classList.add('erro');}}
    setTimeout(()=>{for(let i=0;i<4;i++){const el=document.getElementById('pd-'+i);if(el)el.classList.remove('erro');}},800);
  }
}
function modalSetupPin(){
  const temPin=!!state.config.pinHash;
  openModal(`
    <div class="modal-head"><h2>${temPin?'Alterar':'Configurar'} PIN</h2><button onclick="closeModal()">${ICON.x(20)}</button></div>
    <p style="font-size:13px;color:var(--text-2);margin-bottom:16px">PIN de 4 dígitos. Cada dispositivo fica logado por <strong>30 dias</strong>.</p>
    ${temPin?`<div class="field"><label class="lbl">PIN atual</label><input id="pin-old" type="tel" maxlength="4" inputmode="numeric" pattern="[0-9]*" class="inp" placeholder="PIN atual"></div>`:''}
    <div class="field"><label class="lbl">Novo PIN</label><input id="pin-new" type="tel" maxlength="4" inputmode="numeric" pattern="[0-9]*" class="inp" placeholder="4 dígitos"></div>
    <div class="field"><label class="lbl">Confirmar PIN</label><input id="pin-conf" type="tel" maxlength="4" inputmode="numeric" pattern="[0-9]*" class="inp" placeholder="Repita"></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="salvarPin()">Salvar PIN</button></div>
  `);
}
async function salvarPin(){
  const temPin=!!state.config.pinHash;
  const novo=document.getElementById('pin-new').value.trim();
  const conf=document.getElementById('pin-conf').value.trim();
  if(!/^\d{4}$/.test(novo)){alert('PIN deve ter exatamente 4 dígitos.');return;}
  if(novo!==conf){alert('Os PINs não coincidem.');return;}
  if(temPin){const h=await hashPin(document.getElementById('pin-old').value.trim());if(h!==state.config.pinHash){alert('PIN atual incorreto.');return;}}
  state.config.pinHash=await hashPin(novo);
  saveConfig();
  LS.set('bc:session',{pinHash:state.config.pinHash,expires:Date.now()+30*24*60*60*1000});
  closeModal();render();
  alert('✅ PIN configurado! Este dispositivo fica logado por 30 dias.');
}
async function removerPin(){
  if(!state.config.pinHash) return;
  const pin=prompt('Digite o PIN atual para confirmar remoção:'); if(!pin) return;
  const h=await hashPin(pin);
  if(h!==state.config.pinHash){alert('PIN incorreto.');return;}
  if(!confirm('Remover PIN? O sistema ficará público para quem tiver o link.')) return;
  state.config.pinHash='';saveConfig();LS.set('bc:session',null);render();
}

  let lista=state.agendamentos.filter(a=>!agFiltro||a.data===agFiltro);
  if(agFiltroBarb) lista=lista.filter(a=>a.barbeiro===agFiltroBarb);
  if(agFiltroStatus) lista=lista.filter(a=>a.status===agFiltroStatus);
  lista.sort((a,b)=>a.hora>b.hora?1:-1);
  const barbs=[...new Set(state.agendamentos.map(a=>a.barbeiro).filter(Boolean))];
  const filtroDesc = [agFiltroBarb?`barbeiro: ${agFiltroBarb}`:'', agFiltroStatus?`status: ${ST_LBL[agFiltroStatus]||agFiltroStatus}`:''  ].filter(Boolean).join(' · ');
  return `
    <div class="sec-head"><div><h1>Agenda</h1><p>${lista.length} agendamento(s)${filtroDesc?' — '+filtroDesc:''}</p></div>
      <button class="btn btn-primary" onclick="modalAgenda()">+ Novo Agendamento</button></div>
    ${weekStrip()}
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
      <input type="date" class="inp" style="flex:1;min-width:140px" value="${agFiltro}" onchange="agFiltro=this.value;render()">
      ${barbs.length>1?`<select class="inp" style="flex:1;min-width:120px" onchange="agFiltroBarb=this.value;render()"><option value="">Todos barbeiros</option>${barbs.map(b=>`<option value="${esc(b)}" ${agFiltroBarb===b?'selected':''}>${esc(b)}</option>`).join('')}</select>`:''}
      <select class="inp" style="flex:1;min-width:120px" onchange="agFiltroStatus=this.value;render()"><option value="">Todos status</option>${['agendado','concluido','cancelado'].map(s=>`<option value="${s}" ${agFiltroStatus===s?'selected':''}>${ST_LBL[s]}</option>`).join('')}</select>
    </div>
    ${lista.length?lista.map(a=>`<div class="card list-item" style="padding:15px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-weight:700;font-size:14px;color:${ST_COLOR[a.status]}">${esc(a.clienteNome)}</span>
          <span class="badge" style="background:${ST_BG[a.status]};color:${ST_COLOR[a.status]}">${ST_LBL[a.status]}</span></div>
          <div style="font-size:12px;color:var(--text-2)">${a.ePacote?'<span style="color:var(--amber);font-size:11px;font-weight:700">📦 PACOTE · </span>':''}${esc(a.servico)}${servicoDuracao(a.servico)?' · '+servicoDuracao(a.servico)+'min':''}${a.barbeiro?' · '+esc(a.barbeiro):''}${a.clienteTelefone?' · '+esc(a.clienteTelefone):''}</div>
          ${a.obs?`<div style="font-size:11px;color:var(--text-3);margin-top:4px">${esc(a.obs)}</div>`:''}</div>
        <div style="text-align:right;flex-shrink:0;margin-left:10px"><div style="font-size:17px;font-weight:700;color:var(--gold)">${esc(a.hora)}</div><div style="font-size:10px;color:var(--text-3)">${fmtDate(a.data)}</div></div>
      </div>
      <div class="actions">
        ${a.status!=='concluido'?`<button class="btn btn-green btn-sm" onclick="modalConcluir('${a.id}')">✓ Concluir</button>`:''}
        ${a.status!=='cancelado'?`<button class="btn btn-amber btn-sm" onclick="setStatusAg('${a.id}','cancelado')">✕ Cancelar</button>`:''}
        ${a.clienteTelefone?`<button class="btn btn-sm ${a.confirmacaoEnviada?'btn-green':''}" onclick="enviarConfirmacao('${a.id}')">${a.confirmacaoEnviada?'✅ Confirmado':'📲 Confirmação'}</button>`:''}
        ${a.clienteTelefone?`<button class="btn btn-sm" onclick="modalMensagens('${a.id}')">📩 Mensagens</button>`:''}
        <button class="btn btn-sm" onclick="modalAgenda('${a.id}')">Editar</button>
        <button class="btn btn-red btn-sm" onclick="delAgenda('${a.id}')">Remover</button>
      </div></div>`).join(''):`<div class="card empty">${ICON.calendar(36,'#252525')}<p>Nenhum agendamento para este dia</p><button class="btn btn-primary" onclick="modalAgenda()">Novo Agendamento</button></div>`}`;
}
function setStatusAg(id,st){
  const a=state.agendamentos.find(x=>x.id===id);
  if(a && st!=='concluido' && a.lancamentoId){
    state.lancamentos=state.lancamentos.filter(l=>l.id!==a.lancamentoId); save('lancamentos');
  }
  state.agendamentos=state.agendamentos.map(x=>x.id===id?{...x,status:st,lancamentoId:(st==='concluido'?x.lancamentoId:null)}:x);
  save('agendamentos'); render();
}
function delAgenda(id){
  if(confirm('Remover este agendamento?')){
    const a=state.agendamentos.find(x=>x.id===id);
    if(a && a.lancamentoId){ state.lancamentos=state.lancamentos.filter(l=>l.id!==a.lancamentoId); save('lancamentos'); }
    state.agendamentos=state.agendamentos.filter(x=>x.id!==id); save('agendamentos'); render();
  }
}
function modalAgenda(id){
  const dataDef = agFiltro||todayStr();
  const a = id?state.agendamentos.find(x=>x.id===id):{clienteNome:'',clienteTelefone:'',servico:'',barbeiro:'',data:dataDef,hora:(dataDef===todayStr()?horaAgora():'09:00'),status:'agendado',obs:''};
  openModal(`
    <div class="modal-head"><h2>${id?'Editar':'Novo'} Agendamento</h2><button onclick="closeModal()">${ICON.x(20)}</button></div>
    ${state.clientes.length?`<div class="toggle-grid" id="ag-modo-toggle" style="margin-bottom:14px">
      <button class="toggle" data-m="cadastrado" onclick="setAgModo('cadastrado')">Cliente cadastrado</button>
      <button class="toggle" data-m="novo" onclick="setAgModo('novo')">Digitar nome</button>
    </div>`:''}
    <div id="ag-modo-cad" style="display:none">
      <div class="field"><label class="lbl">Buscar Cliente</label>
        <select id="m-cliente-sel" class="inp" onchange="selecionarCliente()"><option value="">Buscar cliente cadastrado...</option>${state.clientes.filter(c=>!c.bloqueado).slice().sort((x,y)=>x.nome.localeCompare(y.nome)).map(c=>`<option value="${c.id}">${esc(c.nome)}${c.telefone?' · '+esc(c.telefone):''}</option>`).join('')}</select>
        <div style="font-size:11px;color:var(--text-3);margin-top:6px">Dica: digite as primeiras letras do nome para localizar.</div>
      </div>
    </div>
    <div id="ag-modo-novo">
      <div class="field"><label class="lbl">Nome do Cliente</label><input id="m-nome" class="inp" value="${esc(a.clienteNome)}" placeholder="Nome completo"></div>
      <div class="field"><label class="lbl">Telefone (WhatsApp)</label><input id="m-tel" class="inp" value="${esc(a.clienteTelefone)}" placeholder="(11) 99999-9999"></div>
    </div>
    <div class="row2"><div class="field"><label class="lbl">Data</label><input id="m-data" type="date" class="inp" value="${a.data}" onchange="ajustarHoraMin()"></div>
      <div class="field"><label class="lbl">Hora</label><input id="m-hora" type="time" class="inp" value="${a.hora}"></div></div>
    <div class="field"><label class="lbl">Serviço</label><select id="m-serv" class="inp"><option value="">Selecionar...</option>${state.config.servicos.map(s=>`<option ${a.servico===s.nome?'selected':''}>${esc(s.nome)}</option>`).join('')}</select></div>
    <div class="field"><label class="lbl">Barbeiro</label><select id="m-barb" class="inp"><option value="">Selecionar...</option>${state.config.barbeiros.map(b=>`<option ${a.barbeiro===b?'selected':''}>${esc(b)}</option>`).join('')}</select></div>
    <div class="field"><label class="lbl">Status</label><select id="m-status" class="inp">${['agendado','concluido','cancelado'].map(s=>`<option value="${s}" ${a.status===s?'selected':''}>${ST_LBL[s]}</option>`).join('')}</select></div>
    <div class="field"><label class="lbl">Observações</label><textarea id="m-obs" class="inp" placeholder="Opcional...">${esc(a.obs)}</textarea></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveAgenda('${id||''}')">Salvar</button></div>
  `);
  agModo=(!id && state.clientes.length)?'cadastrado':'novo';
  setAgModo(agModo);
  ajustarHoraMin();
}
function horaAgora(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function ajustarHoraMin(){
  const dataEl=document.getElementById('m-data'), horaEl=document.getElementById('m-hora');
  if(!dataEl||!horaEl) return;
  if(dataEl.value===todayStr()) horaEl.min=horaAgora(); else horaEl.removeAttribute('min');
}
function setAgModo(m){
  agModo=m;
  const cad=document.getElementById('ag-modo-cad'), novo=document.getElementById('ag-modo-novo');
  if(cad) cad.style.display=m==='cadastrado'?'block':'none';
  if(novo) novo.style.display=m==='novo'?'block':'none';
  document.querySelectorAll('#ag-modo-toggle .toggle').forEach(b=>b.classList.toggle('on-gold',b.dataset.m===m));
}
function selecionarCliente(){
  const id=document.getElementById('m-cliente-sel').value;
  const c=state.clientes.find(x=>x.id===id);
  document.getElementById('m-nome').value=c?c.nome:'';
  document.getElementById('m-tel').value=c?(c.telefone||''):'';
  atualizarServicosModal(c?.nome||'');
}
function atualizarServicosModal(nomeCliente){
  const sel=document.getElementById('m-serv'); if(!sel) return;
  const pacAtivos=nomeCliente?pacotesAtivosCliente(nomeCliente):[];
  let opts='<option value="">Selecionar...</option>';
  if(pacAtivos.length){
    opts+=`<optgroup label="📦 Pacotes do cliente">`;
    pacAtivos.forEach(p=>{
      p.servicos.forEach((s,si)=>{
        const rest=s.quantidade-(s.usados||0);
        if(rest>0) opts+=`<option value="PACOTE:${p.id}:${si}">📦 ${esc(p.nome||'Pacote')} — ${esc(s.servico)} (${rest} restante${rest>1?'s':''})</option>`;
      });
    });
    opts+=`</optgroup><optgroup label="Serviços avulsos">`;
    state.config.servicos.forEach(s=>{ opts+=`<option value="${esc(s.nome||s)}">${esc(s.nome||s)}</option>`; });
    opts+=`</optgroup>`;
  } else {
    state.config.servicos.forEach(s=>{ opts+=`<option value="${esc(s.nome||s)}">${esc(s.nome||s)}</option>`; });
  }
  sel.innerHTML=opts;
}
function saveAgenda(id){
  const g=x=>document.getElementById(x).value;
  const data={clienteNome:g('m-nome').trim(),clienteTelefone:g('m-tel').trim(),servico:g('m-serv'),barbeiro:g('m-barb'),data:g('m-data'),hora:g('m-hora'),status:g('m-status'),obs:g('m-obs').trim()};
  if(!data.clienteNome||!data.servico||!data.data||!data.hora){ alert('Preencha nome, serviço, data e hora.'); return; }
  if(!id && data.data===todayStr() && data.hora < horaAgora()){ alert('Esse horário já passou hoje. Escolha um horário a partir de agora.'); return; }
  // detecta serviço de pacote
  let pacoteRef={};
  if(data.servico.startsWith('PACOTE:')){
    const pts=data.servico.split(':');
    const pk=state.pacotes.find(x=>x.id===pts[1]);
    const si=parseInt(pts[2]);
    if(pk&&pk.servicos[si]){
      data.servico=pk.servicos[si].servico;
      pacoteRef={ePacote:true,pacoteId:pts[1],pacoteServIdx:si};
    }
  }
  // cadastra automaticamente o cliente se ainda não existir
  const telNorm=data.clienteTelefone.replace(/\D/g,'');
  const jaExiste=state.clientes.some(c=>c.nome.trim().toLowerCase()===data.clienteNome.toLowerCase()||(telNorm&&(c.telefone||'').replace(/\D/g,'')===telNorm));
  if(!jaExiste){
    state.clientes.push({id:uid(),nome:data.clienteNome,telefone:data.clienteTelefone,dataNascimento:'',observacoes:'',bloqueado:false,createdAt:Date.now()});
    save('clientes');
  }
  // detecta alteração de horário (notificação para o cliente)
  if(id){
    const ag=state.agendamentos.find(a=>a.id===id);
    if(ag&&(ag.data!==data.data||ag.hora!==data.hora)){
      state.notifAlteracao.push({id:uid(),agId:id,clienteNome:data.clienteNome,clienteTelefone:data.clienteTelefone,servico:data.servico,dataAnterior:ag.data,horaAnterior:ag.hora,novaData:data.data,novaHora:data.hora,createdAt:Date.now(),enviado:false});
      save('notifAlteracao');
    }
    state.agendamentos=state.agendamentos.map(a=>a.id===id?{...a,...data,...pacoteRef}:a);
  } else {
    state.agendamentos.push({...data,...pacoteRef,id:uid(),createdAt:Date.now(),confirmacaoEnviada:false});
  }
  save('agendamentos'); closeModal(); render();
}

/* ============ LEMBRETES (WhatsApp em 1 toque) ============ */
function lembretesPendentes(){
  const agora=new Date();
  const ativos=(state.config.lembretes||[]).filter(l=>l.ativo);
  const pend=[];
  state.agendamentos.filter(a=>a.status==='agendado').forEach(a=>{
    const dt=new Date(a.data+'T'+(a.hora||'00:00'));
    if(isNaN(dt)||dt<agora) return;
    ativos.forEach(l=>{
      const inicio=new Date(dt.getTime()-l.horasAntes*3600000);
      const key=a.id+'_'+l.id;
      // só mostra se, quando o agendamento foi criado, ainda faltava esse tempo (ex: 24h)
      if(agora>=inicio && (a.createdAt||0)<=inicio.getTime() && !state.lembretesEnviados.includes(key)) pend.push({ag:a,lembrete:l,key});
    });
  });
  pend.sort((x,y)=>`${x.ag.data}${x.ag.hora}`>`${y.ag.data}${y.ag.hora}`?1:-1);
  return pend;
}
function lembretesProximos(){
  const agora=new Date();
  const ativos=(state.config.lembretes||[]).filter(l=>l.ativo);
  const prox=[];
  state.agendamentos.filter(a=>a.status==='agendado').forEach(a=>{
    const dt=new Date(a.data+'T'+(a.hora||'00:00'));
    if(isNaN(dt)||dt<agora) return;
    ativos.forEach(l=>{
      const inicio=new Date(dt.getTime()-l.horasAntes*3600000);
      const key=a.id+'_'+l.id;
      // ainda NÃO chegou a hora, mas faz sentido (criado com antecedência) e não foi enviado
      if(agora<inicio && (a.createdAt||0)<=inicio.getTime() && !state.lembretesEnviados.includes(key)) prox.push({ag:a,lembrete:l,key,inicio});
    });
  });
  prox.sort((x,y)=>x.inicio-y.inicio);
  return prox;
}
function montarMsgAlteracao(n){
  return (state.config.msgAlteracao||'')
    .replace(/\{nome\}/g, n.clienteNome||'')
    .replace(/\{data\}/g, fmtDate(n.novaData)||'')
    .replace(/\{hora\}/g, n.novaHora||'')
    .replace(/\{servico\}/g, n.servico||'')
    .replace(/\{dataAnterior\}/g, fmtDate(n.dataAnterior)||'')
    .replace(/\{horaAnterior\}/g, n.horaAnterior||'');
}
function enviarNotifAlteracao(id){
  const n=state.notifAlteracao.find(x=>x.id===id); if(!n) return;
  abrirWhatsApp(n.clienteTelefone, montarMsgAlteracao(n));
  state.notifAlteracao=state.notifAlteracao.map(x=>x.id===id?{...x,enviado:true}:x);
  save('notifAlteracao'); render();
}
function descartarNotifAlteracao(id){ state.notifAlteracao=state.notifAlteracao.filter(x=>x.id!==id); save('notifAlteracao'); render(); }

      <span style="color:var(--text-2)">iPhone: Configurações → Safari → ${isPWA?'Barbearia Ceribelli':'Configurações do website'} → Notificações → Permitir<br>

    ${notifs.length?`<h3 style="font-size:13px;margin-bottom:10px;color:var(--amber)">⚠️ Alterações de Horário</h3>

let concluirProdutos=[];
function modalConcluir(id){

        <div style="font-size:13px;font-weight:600;color:var(--amber);margin-bottom:4px">📦 Atendimento de Pacote</div>

  openModal(`
    <div class="modal-head"><h2>Concluir Atendimento</h2><button onclick="closeModal()">${ICON.x(20)}</button></div>
    <div style="font-size:13px;color:var(--text-2);margin-bottom:14px">${esc(a.clienteNome)} · ${esc(a.servico)}</div>
    <div class="field"><label class="lbl">Valor do serviço (R$)</label><input id="cc-valor" type="number" step="0.01" min="0" class="inp" value="${preco}" oninput="updConcluir()"></div>
    <div class="field"><label class="lbl">Produtos vendidos (opcional)</label>
      <select id="cc-prod-sel" class="inp" onchange="addProdutoConcluir()"><option value="">Selecione um produto para adicionar...</option>${state.produtos.slice().sort((x,y)=>x.nome.localeCompare(y.nome)).map(p=>`<option value="${p.id}">${esc(p.nome)} · ${fmtMoney(p.preco)}</option>`).join('')}</select>

    </div>
    <div class="field"><label class="lbl">Desconto</label><div style="display:flex;gap:6px"><input id="cc-desc" type="number" step="0.01" min="0" class="inp" value="0" oninput="updConcluir()" style="flex:1"><select id="cc-tipo" class="inp" style="width:64px" onchange="updConcluir()"><option value="reais">R$</option><option value="pct">%</option></select></div></div>
    <div class="field"><label class="lbl">Forma de Pagamento</label><div class="pay-grid" id="cc-pay">
      ${[['pix','Pix'],['dinheiro','Dinheiro'],['debito',`Débito (−${state.config.taxaDebito}%)`],['credito',`Crédito (−${state.config.taxaCredito}%)`]].map(([v,l])=>`<button class="pay ${v==='pix'?'on':''}" data-p="${v}" onclick="setConcluirPay('${v}')">${l}</button>`).join('')}
    </div></div>
    <div id="cc-resumo" style="padding:10px 12px;background:var(--green-bg);border-radius:7px;font-size:13px;color:var(--green);margin-bottom:8px"></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="confirmarConcluir('${id}')">Confirmar e lançar</button></div>
  `);
  renderProdutosConcluir(); updConcluir();
}
function setConcluirPay(p){ concluirTmp.formaPagamento=p; document.querySelectorAll('#cc-pay .pay').forEach(b=>b.classList.toggle('on',b.dataset.p===p)); updConcluir(); }
function addProdutoConcluir(){
  const sel=document.getElementById('cc-prod-sel'); const p=state.produtos.find(x=>x.id===sel.value);
  if(!p) return;
  concluirProdutos.push({id:p.id,nome:p.nome,preco:Number(p.preco)||0});
  sel.value=''; renderProdutosConcluir(); updConcluir();
}
function removeProdutoConcluir(i){ concluirProdutos.splice(i,1); renderProdutosConcluir(); updConcluir(); }
function renderProdutosConcluir(){
  const box=document.getElementById('cc-prod-list'); if(!box) return;
  box.innerHTML = concluirProdutos.map((p,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--inner);border:1px solid var(--border);border-radius:7px;margin-bottom:6px;font-size:12px">
    <span>${esc(p.nome)}</span><span style="display:flex;align-items:center;gap:10px"><span style="color:var(--gold)">${fmtMoney(p.preco)}</span><button onclick="removeProdutoConcluir(${i})" style="background:none;border:none;color:var(--red);font-size:15px;cursor:pointer">×</button></span>
  </div>`).join('');
}
function valorFinal(valId,descId,tipoId){
  const v=parseFloat(document.getElementById(valId).value)||0;
  const d=parseFloat(document.getElementById(descId).value)||0;
  const tipo=document.getElementById(tipoId).value;
  let f=tipo==='pct'?v*(1-d/100):v-d;
  return f<0?0:f;
}
function somaProdutosConcluir(){ return concluirProdutos.reduce((s,p)=>s+(Number(p.preco)||0),0); }
function concluirFinal(){
  const serv=parseFloat(document.getElementById('cc-valor').value)||0;
  const base=serv+somaProdutosConcluir();
  const d=parseFloat(document.getElementById('cc-desc').value)||0;
  const tipo=document.getElementById('cc-tipo').value;
  let f=tipo==='pct'?base*(1-d/100):base-d;
  return f<0?0:f;
}
function updConcluir(){
  const serv=parseFloat(document.getElementById('cc-valor').value)||0;
  const prod=somaProdutosConcluir();
  const f=concluirFinal();
  const liq=calcLiquido(f,concluirTmp.formaPagamento);
  const box=document.getElementById('cc-resumo');
  if(box) box.innerHTML = (prod>0?`Serviço ${fmtMoney(serv)} + Produtos ${fmtMoney(prod)}<br>`:'')+`Valor final: <strong>${fmtMoney(f)}</strong>`+(Math.abs(liq-f)>0.001?` · Líquido após taxa: <strong>${fmtMoney(liq)}</strong>`:'');
}
function confirmarConcluir(id){
  const a=state.agendamentos.find(x=>x.id===id); if(!a) return;
  const f=concluirFinal();
  const liq=calcLiquido(f,concluirTmp.formaPagamento);
  if(a.lancamentoId) state.lancamentos=state.lancamentos.filter(l=>l.id!==a.lancamentoId); // evita duplicar
  const lancId=uid();
  const nomesProd=concluirProdutos.map(p=>p.nome);
  const desc=`${a.servico} — ${a.clienteNome}`+(nomesProd.length?` (+ ${nomesProd.join(', ')})`:'');
  state.lancamentos.push({id:lancId,tipo:'entrada',descricao:desc,categoria:'Serviço',valor:f,valorLiquido:liq,formaPagamento:concluirTmp.formaPagamento,data:a.data,createdAt:Date.now(),origem:'agendamento'});
  if(concluirProdutos.length){
    concluirProdutos.forEach(cp=>{ const prod=state.produtos.find(x=>x.id===cp.id); if(prod && prod.estoque!==''&&prod.estoque!=null) prod.estoque=Math.max(0,parseInt(prod.estoque)-1); });
    save('produtos');
  }
  state.agendamentos=state.agendamentos.map(x=>x.id===id?{...x,status:'concluido',lancamentoId:lancId}:x);
  save('lancamentos'); save('agendamentos'); closeModal(); render();
}

/* ============ BARBEIROS ============ */
let barbFiltro=todayStr(), barbModo='mes';
function barbNavDate(dir){
  const d=parseLocalDate(barbFiltro); const D=new Date(d);
  if(barbModo==='dia'){D.setDate(D.getDate()+dir);}
  else if(barbModo==='semana'){D.setDate(D.getDate()+dir*7);}
  else if(barbModo==='mes'){D.setMonth(D.getMonth()+dir);}
  return toISO(D);
}
function barbPeriodoLabel(){
  if(barbModo==='dia') return fmtDate(barbFiltro);
  if(barbModo==='semana'){ const w=weekDays(barbFiltro); return `${fmtDate(w[0])} – ${fmtDate(w[6])}`; }
  return new Date(barbFiltro+'-01T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
}
function viewBarbeiros(){
  const barbs=state.config.barbeiros||[];
  const com=state.config.comissoes||{};
  const dias=barbModo==='semana'?weekDays(barbFiltro):[];
  const filtroAg=a=>{
    if(barbModo==='dia') return a.data===barbFiltro;
    if(barbModo==='semana') return dias.includes(a.data);
    return (a.data||'').startsWith(barbFiltro.slice(0,7));
  };
  const modos=[['dia','Dia'],['semana','Semana'],['mes','Mês']];
  return `
    <div class="sec-head"><div><h1>Barbeiros</h1><p>Produção e comissões por período</p></div></div>
    <div class="tabs" style="margin-bottom:12px">${modos.map(([id,l])=>`<button class="tab ${barbModo===id?'active':''}" onclick="barbModo='${id}';render()">${l}</button>`).join('')}</div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
      <button class="btn btn-sm" onclick="barbFiltro='${barbNavDate(-1)}';render()">‹</button>
      <span style="font-size:13px;font-weight:600;color:var(--gold);flex:1;text-align:center">${barbPeriodoLabel()}</span>
      ${barbModo==='dia'?`<input type="date" class="inp" style="max-width:140px" value="${barbFiltro}" onchange="barbFiltro=this.value;render()">`:barbModo==='mes'?`<input type="month" class="inp" style="max-width:140px" value="${barbFiltro.slice(0,7)}" onchange="barbFiltro=this.value+'-01';render()">`:``}
      <button class="btn btn-sm" onclick="barbFiltro='${barbNavDate(1)}';render()">›</button>
    </div>
    ${barbs.length?barbs.map(b=>{
      const ags=state.agendamentos.filter(a=>a.barbeiro===b&&a.status==='concluido'&&filtroAg(a));
      const agsPag=ags.filter(a=>!a.ePacote);
      const agsPac=ags.filter(a=>a.ePacote);
      const receita=agsPag.reduce((s,a)=>{ const l=state.lancamentos.find(x=>x.id===a.lancamentoId); return s+(l?(l.valor||0):0); },0);
      const pct=parseFloat(com[b])||0;
      const comissao=receita*pct/100;
      const byServico={};
      ags.forEach(a=>{ byServico[a.servico]=(byServico[a.servico]||0)+1; });
      return `<div class="card list-item" style="padding:16px">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--gold-m),#2A2A2A);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--gold)">${esc(b.charAt(0).toUpperCase())}</div>
            <div><div style="font-weight:700;font-size:15px">${esc(b)}</div><div style="font-size:11px;color:var(--text-2)">${ags.length} serviço(s) · ${barbPeriodoLabel()}</div></div>
          </div>
          <div style="text-align:right"><div style="font-size:16px;font-weight:700;color:var(--green)">${fmtMoney(receita)}</div><div style="font-size:10px;color:var(--text-3)">receita bruta</div></div>
        </div>
        ${agsPac.length?`<div style="padding:8px 12px;background:var(--amber-bg);border:1px solid rgba(245,158,11,.2);border-radius:8px;font-size:11px;color:var(--amber);margin-bottom:10px">📦 +${agsPac.length} atendimento(s) de pacote — sem lançamento financeiro individual</div>`:''}
        ${Object.keys(byServico).length?`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">${Object.entries(byServico).map(([s,n])=>`<span style="padding:3px 10px;background:var(--inner);border:1px solid var(--border);border-radius:12px;font-size:11px;color:var(--text-2)">${esc(s)}: <strong>${n}x</strong></span>`).join('')}</div>`:''}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div style="padding:10px;background:var(--inner);border-radius:8px;text-align:center">
            <div style="font-size:11px;color:var(--text-3);margin-bottom:3px">% Comissão</div>
            <div style="font-size:16px;font-weight:700;color:var(--gold)">${pct}%</div>
          </div>
          <div style="padding:10px;background:${comissao>0?'var(--amber-bg)':'var(--inner)'};border:1px solid ${comissao>0?'var(--amber)':'var(--border)'};border-radius:8px;text-align:center">
            <div style="font-size:11px;color:var(--text-3);margin-bottom:3px">A pagar</div>
            <div style="font-size:16px;font-weight:700;color:${comissao>0?'var(--amber)':'var(--text-3)'}">${fmtMoney(comissao)}</div>
          </div>
        </div>
        ${pct===0?`<p style="font-size:11px;color:var(--text-3);margin-top:8px;text-align:center">Configure o % em Config → Financeiro</p>`:''}
        ${ags.length===0?`<p style="font-size:12px;color:var(--text-3);text-align:center;margin-top:8px">Nenhum serviço concluído neste período</p>`:''}
      </div>`;
    }).join(''):`<div class="card empty">${ICON.cut(36,'#252525')}<p>Nenhum barbeiro cadastrado</p><button class="btn btn-primary" onclick="cfgTab='barbearia';setView('configuracoes')">Cadastrar Barbeiro</button></div>`}`;
}

}
function enviarMsgPacote(pid){
  const p=state.pacotes.find(x=>x.id===pid); if(!p) return;

  if(!c?.telefone){alert('Este cliente não tem telefone cadastrado.');return;}
  const msg=(state.config.msgPacoteRenovado||'')
    .replace(/\{nome\}/g,p.clienteNome)
    .replace(/\{pacote\}/g,p.nome||'Pacote')
    .replace(/\{mes\}/g,new Date((p.mes||todayStr().slice(0,7))+'-01T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'}))
    .replace(/\{valor\}/g,fmtMoney(p.valorTotal||0));
  abrirWhatsApp(c.telefone,msg);
}

  const a=state.agendamentos.find(x=>x.id===id); if(!a) return;
  if(a.pacoteId!==undefined&&a.pacoteServIdx!==undefined){
    state.pacotes=state.pacotes.map(p=>p.id===a.pacoteId?{...p,servicos:p.servicos.map((s,i)=>i===a.pacoteServIdx?{...s,usados:(s.usados||0)+1}:s)}:p);

      const total=p.servicos.reduce((s,x)=>s+x.quantidade,0);

          <div style="text-align:right"><div style="font-size:15px;font-weight:700;color:var(--green)">${fmtMoney(p.valorTotal||0)}</div><div style="font-size:10px;color:var(--text-3)">/mês</div></div>

        <div style="font-size:11px;color:var(--text-3);margin-bottom:10px">${usados}/${total} serviços usados (${pct}%)</div>
        ${p.servicos.map((s,si)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:var(--inner);border-radius:7px;margin-bottom:5px">

          <button class="btn btn-red btn-sm" onclick="encerrarPacote('${p.id}')">Encerrar</button>

    }).join(''):`<div class="card empty">${ICON.tag(36,'#252525')}<p>Nenhum pacote ativo</p><p style="font-size:12px;color:var(--text-3);margin-bottom:4px">Crie pacotes mensais para clientes que cortam toda semana</p><button class="btn btn-primary" onclick="modalPacote()">Criar Pacote</button></div>`}`;

function usarServicoPacote(pid,si){
  state.pacotes=state.pacotes.map(p=>p.id===pid?{...p,servicos:p.servicos.map((s,i)=>i===si?{...s,usados:(s.usados||0)+1}:s)}:p);

}
function resetarPacote(pid){

}
function encerrarPacote(pid){ if(!confirm('Encerrar este pacote?')) return; state.pacotes=state.pacotes.map(p=>p.id===pid?{...p,ativo:false}:p); save('pacotes'); render(); }

function renderServPacote(){

function addServPacote(){
  const primeiro=(state.config.servicos||[])[0]; pacoteServicosTemp.push({servico:primeiro?.nome||primeiro||'Corte',quantidade:4,usados:0});
  document.getElementById('pk-servicos').innerHTML=renderServPacote('');

function savePacote(id){
  const cliId=document.getElementById('pk-cli').value;

/* ============ FINANCEIRO ============ */
let finFiltro=todayStr(), finModo='mes';
const FP_COLOR={pix:'#10B981',dinheiro:'#3B82F6',debito:'#8B5CF6',credito:'#F59E0B'};
const CATS=['Serviço','Produto','Aluguel','Material','Salário','Outros'];
function finLista(){
  const dias=weekDays(finFiltro);
  const filtros={dia:l=>l.data===finFiltro,semana:l=>dias.includes(l.data),mes:l=>(l.data||'').startsWith(finFiltro.slice(0,7)),ano:l=>(l.data||'').startsWith(finFiltro.slice(0,4)),tudo:()=>true};
  return state.lancamentos.filter(filtros[finModo]||filtros.tudo).sort((a,b)=>b.createdAt-a.createdAt);
}
function periodoLabel(){
  const d=finFiltro, mes=d.slice(0,7), ano=d.slice(0,4);
  const labels={
    dia:fmtDate(d),
    semana:`${fmtDate(weekDays(d)[0])} – ${fmtDate(weekDays(d)[6])}`,
    mes:new Date(d+'T12:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'}),
    ano,tudo:'Todo o período'
  };
  return labels[finModo]||'';
}
function viewFinanceiro(){
  const lista=finLista();
  const ent=lista.filter(l=>l.tipo==='entrada').reduce((s,l)=>s+(l.valorLiquido??l.valor),0);
  const sai=lista.filter(l=>l.tipo==='saida').reduce((s,l)=>s+l.valor,0);
  const saldo=ent-sai;
  const entAll=state.lancamentos.filter(l=>l.tipo==='entrada').reduce((s,l)=>s+(l.valorLiquido??l.valor),0);
  const saiAll=state.lancamentos.filter(l=>l.tipo==='saida').reduce((s,l)=>s+l.valor,0);
  // por forma de pagamento (entradas)
  const fps=['pix','dinheiro','debito','credito'];
  const entFP=fps.map(fp=>({fp,v:lista.filter(l=>l.tipo==='entrada'&&l.formaPagamento===fp).reduce((s,l)=>s+(l.valorLiquido??l.valor),0)})).filter(x=>x.v>0);
  const modos=[['dia','Dia'],['semana','Semana'],['mes','Mês'],['ano','Ano'],['tudo','Tudo']];
  // navegação prev/next
  function navDate(dir){
    const d=parseLocalDate(finFiltro); const D=new Date(d);
    if(finModo==='dia'){D.setDate(D.getDate()+dir);}
    else if(finModo==='semana'){D.setDate(D.getDate()+dir*7);}
    else if(finModo==='mes'){D.setMonth(D.getMonth()+dir);}
    else if(finModo==='ano'){D.setFullYear(D.getFullYear()+dir);}
    return toISO(D);
  }
  const showNav=finModo!=='tudo';
  return `
    <div class="sec-head"><div><h1>Financeiro</h1><p>Controle de entradas e saídas</p></div>
      <button class="btn btn-primary" onclick="modalLanc()">+ Novo Lançamento</button></div>
    <div class="tabs" style="margin-bottom:12px">${modos.map(([id,l])=>`<button class="tab ${finModo===id?'active':''}" onclick="finModo='${id}';render()">${l}</button>`).join('')}</div>
    ${finModo==='dia'?`<input type="date" class="inp" style="max-width:180px;margin-bottom:14px" value="${finFiltro}" onchange="finFiltro=this.value;render()">`:
      finModo==='mes'?`<input type="month" class="inp" style="max-width:180px;margin-bottom:14px" value="${finFiltro.slice(0,7)}" onchange="finFiltro=this.value+'-01';render()">`:
      showNav?`<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <button class="btn btn-sm" onclick="finFiltro='${navDate(-1)}';render()">‹</button>
        <span style="font-size:13px;font-weight:600;color:var(--gold)">${periodoLabel()}</span>
        <button class="btn btn-sm" onclick="finFiltro='${navDate(1)}';render()">›</button>
      </div>`:`<div style="margin-bottom:14px;font-size:13px;font-weight:600;color:var(--gold)">${periodoLabel()}</div>`}
    <div class="row3" style="margin-bottom:16px">
      ${[{l:'Entradas',v:fmtMoney(ent),c:'var(--green)',bg:'var(--green-bg)'},{l:'Saídas',v:fmtMoney(sai),c:'var(--red)',bg:'var(--red-bg)'},{l:'Saldo',v:fmtMoney(saldo),c:saldo>=0?'var(--green)':'var(--red)',bg:saldo>=0?'var(--green-bg)':'var(--red-bg)'}].map(c=>
        `<div style="background:${c.bg};border:1px solid ${c.c}30;border-radius:10px;padding:12px;text-align:center">
          <div style="font-size:14px;font-weight:700;color:${c.c}">${c.v}</div>
          <div style="font-size:10px;color:${c.c};opacity:.7;margin-top:2px;font-weight:700;text-transform:uppercase;letter-spacing:.05em">${c.l}</div>
        </div>`).join('')}

function modalLanc(){

  openModal(`
    <div class="modal-head"><h2>Novo Lançamento</h2><button onclick="closeModal()">${ICON.x(20)}</button></div>
    <div class="toggle-grid" id="l-toggle">
      <button class="toggle on-green" data-t="entrada" onclick="setLancTipo('entrada')">${ICON.up(15,'#22C55E')} Entrada</button>

    </div>
    <div class="field"><label class="lbl">Descrição</label><input id="l-desc" class="inp" placeholder="Ex: Corte + Barba — Cliente"></div>
    <div class="row2"><div class="field"><label class="lbl">Valor (R$)</label><input id="l-valor" type="number" step="0.01" min="0" class="inp" placeholder="0,00" oninput="updLiquido()"></div>
      <div class="field"><label class="lbl">Data</label><input id="l-data" type="date" class="inp" value="${todayStr()}"></div></div>
    <div class="field"><label class="lbl">Categoria</label><select id="l-cat" class="inp"><option value="">Selecionar...</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div class="field"><label class="lbl">Forma de Pagamento</label><div class="pay-grid" id="l-pay">
      ${[['pix','Pix'],['dinheiro','Dinheiro'],['debito',`Débito (−${state.config.taxaDebito}%)`],['credito',`Crédito (−${state.config.taxaCredito}%)`]].map(([v,l])=>`<button class="pay ${v==='pix'?'on':''}" data-p="${v}" onclick="setLancPay('${v}')">${l}</button>`).join('')}
    </div><div id="l-liquido" style="margin-top:8px"></div></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveLanc()">Adicionar</button></div>
  `);
}
function setLancTipo(t){
  lancTmp.tipo=t;
  document.querySelectorAll('#l-toggle .toggle').forEach(b=>{
    const on=b.dataset.t===t; b.className='toggle'+(on?(t==='entrada'?' on-green':' on-red'):'');
    b.querySelector('svg')?.setAttribute('stroke', on?(t==='entrada'?'#22C55E':'#EF4444'):'#6B7280');
  });
  updLiquido();
}
function setLancPay(p){
  lancTmp.formaPagamento=p;
  document.querySelectorAll('#l-pay .pay').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  updLiquido();
}
function updLiquido(){
  const v=parseFloat(document.getElementById('l-valor').value)||0;
  const box=document.getElementById('l-liquido');
  if(lancTmp.tipo==='entrada'&&v&&(lancTmp.formaPagamento==='debito'||lancTmp.formaPagamento==='credito')){
    box.innerHTML=`<div style="padding:8px 12px;background:var(--amber-bg);border-radius:6px;font-size:12px;color:var(--amber)">💡 Valor líquido: <strong>${fmtMoney(calcLiquido(v,lancTmp.formaPagamento))}</strong></div>`;
  } else box.innerHTML='';
}
function saveLanc(){
  const v=parseFloat(document.getElementById('l-valor').value);
  const desc=document.getElementById('l-desc').value.trim();
  if(!desc||!v){ alert('Informe descrição e valor.'); return; }
  const liquido=lancTmp.tipo==='entrada'?calcLiquido(v,lancTmp.formaPagamento):v;
  state.lancamentos.push({id:uid(),tipo:lancTmp.tipo,descricao:desc,categoria:document.getElementById('l-cat').value,valor:v,valorLiquido:liquido,formaPagamento:lancTmp.formaPagamento,data:document.getElementById('l-data').value,createdAt:Date.now()});
  save('lancamentos'); closeModal(); render();
}

  const p=id?state.produtos.find(x=>x.id===id):{nome:'',categoria:'Outros',descricao:'',preco:'',validade:'',estoque:'',fotoUrl:''};
  prodFoto=p.fotoUrl||'';

        <input type="file" accept="image/*" style="display:none" onchange="lerFoto(event)"></label></div>
    <div class="field"><label class="lbl">Nome</label><input id="p-nome" class="inp" value="${esc(p.nome)}" placeholder="Nome do produto"></div>

  `);

function lerFoto(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async ev=>{
    prodFoto=await comprimirFoto(ev.target.result);
    document.getElementById('p-foto-label').innerHTML=`<div style="position:relative"><img src="${prodFoto}" style="width:100%;height:130px;object-fit:cover;border-radius:8px;border:1px solid var(--border)"><div style="position:absolute;bottom:8px;right:8px;padding:3px 8px;background:rgba(0,0,0,.7);border-radius:5px;font-size:11px">Alterar</div></div><input type="file" accept="image/*" style="display:none" onchange="lerFoto(event)">`;
  };
  r.readAsDataURL(f);
}
function saveProduto(id){
  const g=x=>document.getElementById(x).value;
  const nome=g('p-nome').trim(); if(!nome){ alert('Informe o nome.'); return; }
  const data={nome,categoria:g('p-cat'),descricao:g('p-desc').trim(),preco:parseFloat(g('p-preco'))||0,validade:g('p-val'),estoque:g('p-est')!==''?parseInt(g('p-est')):'',fotoUrl:prodFoto};
  if(id) state.produtos=state.produtos.map(p=>p.id===id?{...p,...data}:p);
  else state.produtos.push({...data,id:uid(),createdAt:Date.now()});
  save('produtos'); closeModal(); render();
}

function saveDespesaFixa(){
  const nome=document.getElementById('df-nome').value.trim();
  const valor=parseFloat(document.getElementById('df-valor').value)||0;
  const dia=parseInt(document.getElementById('df-dia').value)||1;
  const categoria=document.getElementById('df-cat').value;
  if(!nome||!valor){ alert('Preencha nome e valor.'); return; }
  state.config.despesasFixas.push({id:uid(),nome,valor,dia,categoria});
  saveConfig(); closeModal(); render();
}
function lancarDespesasFixas(){
  const mes=todayStr().slice(0,7);
  const jaLancadas=state.lancamentos.filter(l=>l.despesaFixa&&(l.data||'').startsWith(mes)).map(l=>l.despesaFixa);
  const novas=state.config.despesasFixas.filter(d=>!jaLancadas.includes(d.id));
  if(!novas.length){ alert('Todas as despesas fixas já foram lançadas este mês.'); return; }
  novas.forEach(d=>{
    const dia=String(d.dia).padStart(2,'0');
    state.lancamentos.push({id:uid(),tipo:'saida',descricao:d.nome,valor:d.valor,valorLiquido:d.valor,formaPagamento:'pix',categoria:d.categoria||'despesa',data:`${mes}-${dia}`,despesaFixa:d.id,createdAt:Date.now()});
  });
  save('lancamentos'); render();
  alert(`✅ ${novas.length} despesa(s) lançadas para ${mes}.`);
}
function cfg_set(path,v){ const k=path.split('.'); let o=state.config; for(let i=0;i<k.length-1;i++)o=o[k[i]]; o[k[k.length-1]]=v; saveConfig(); }
function cfg_setNum(k,v){ state.config[k]=parseFloat(v)||0; saveConfig(); }
function cfg_addArr(key,inp){ const v=inp.value.trim(); if(v){ state.config[key].push(v); saveConfig(); render(); } }
function cfg_delArr(key,i){ state.config[key].splice(i,1); saveConfig(); render(); }
function cfg_setServ(i,campo,v){ state.config.servicos[i][campo]=parseFloat(v)||0; saveConfig(); }
function cfg_addServico(){

  else { state.config.lembretes.push({id:uid(),horasAntes:h,template:t,ativo:true}); }

/* ============ RECUPERAÇÃO FIREBASE ============ */
function recuperarDoFirebase(){
  if(!db){ alert('Firebase não está conectado. Verifique sua conexão.'); return; }
  if(!confirm('Isso vai recarregar todos os dados da nuvem Firebase e substituir os dados atuais.\nContinuar?')) return;
  setCloudStatus('🔄 Recarregando da nuvem...','#9CA3AF');
  db.collection('dados').get().then(snap=>{
    if(snap.empty){ alert('Nenhum dado encontrado no Firebase.\n\nSe as regras expiraram, acesse:\nFirebase Console → Firestore → Regras\ne publique:\nallow read, write: if true;'); setCloudStatus('',''); return; }
    snap.forEach(doc=>{ const d=doc.data(); if(doc.id==='config'){ if(d&&d.value) state.config=d.value; } else if(doc.id==='notas'){ if(d&&d.value!==undefined) state.notas=d.value; } else if(d&&d.items) state[doc.id]=d.items; });
    ['clientes','agendamentos','lancamentos','produtos','lembretesEnviados','notifAlteracao'].forEach(k=>save(k));
    saveConfig(); LS.set('bc:notas',state.notas); migrarDados(); render();
    setCloudStatus('✅ Dados recuperados!','#22C55E');
    alert('✅ Dados recuperados com sucesso!\n\nAgora use "Exportar backup" para guardar uma cópia local.');
  }).catch(e=>{ alert('❌ Erro: '+e.message); setCloudStatus('',''); });
}

/* ============ BACKUP ============ */
function exportarBackup(){
  const dados={clientes:state.clientes,agendamentos:state.agendamentos,lancamentos:state.lancamentos,produtos:state.produtos,lembretesEnviados:state.lembretesEnviados,notifAlteracao:state.notifAlteracao,notas:state.notas,config:state.config,exportadoEm:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(dados,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='backup-barbearia-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function importarBackup(e){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(d.agendamentos) state.agendamentos=d.agendamentos;
      if(d.clientes) state.clientes=d.clientes;
      if(d.lancamentos) state.lancamentos=d.lancamentos;
      if(d.produtos) state.produtos=d.produtos;
      if(d.lembretesEnviados) state.lembretesEnviados=d.lembretesEnviados;
      if(d.notifAlteracao) state.notifAlteracao=d.notifAlteracao;
      if(d.config) state.config=d.config;
      if(d.notas!==undefined){ state.notas=d.notas; LS.set('bc:notas',state.notas); if(db) db.collection('dados').doc('notas').set({value:state.notas}).catch(()=>{}); }
      ['agendamentos','clientes','lancamentos','produtos','lembretesEnviados','notifAlteracao'].forEach(k=>save(k));
      saveConfig(); migrarDados(); render();
      alert('✅ Backup restaurado com sucesso!');
    }catch(err){ alert('❌ Arquivo inválido. Verifique se é um backup gerado por este sistema.'); }
  };
  r.readAsText(file);
}

/* ============ INIT ============ */
async function boot(){
  migrarDados();
  applyTema();
  // loading state
  const viewEl=document.getElementById('view');
  if(viewEl) viewEl.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:60vh;flex-direction:column;gap:14px"><div style="width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite"></div><p style="font-size:13px;color:var(--text-3)">Carregando...</p></div>`;
  if(db){
    setCloudStatus('☁️ Carregando...','#9CA3AF');
    try{
      const snap = await db.collection('dados').get();
      if(!snap.empty){
        const localPrds = LS.get('bc:produtos') || [];
        snap.forEach(doc=>{
          const d=doc.data();
          if(doc.id==='config'){ if(d&&d.value) state.config=d.value; }
          else if(doc.id==='notas'){ if(d&&d.value!==undefined) state.notas=d.value; }
          else if(doc.id==='produtos'&&d&&d.items){
            // mescla fotos do localStorage (não salvas no Firebase por tamanho)
            state.produtos=d.items.map(p=>{ const loc=localPrds.find(lp=>lp.id===p.id); return loc?.fotoUrl?{...p,fotoUrl:loc.fotoUrl}:p; });
          }
          else if(d&&d.items) state[doc.id]=d.items;
        });
        migrarDados();
        ['clientes','agendamentos','lancamentos','produtos','lembretesEnviados','notifAlteracao','pacotes'].forEach(k=>LS.set('bc:'+k,state[k]));
        LS.set('bc:config',state.config);
        LS.set('bc:notas',state.notas);
      } else {
        // Primeira vez: envia dados locais para a nuvem
        ['clientes','agendamentos','lancamentos','produtos','lembretesEnviados','notifAlteracao','pacotes'].forEach(k=>save(k));
        saveConfig();
        if(state.notas) db.collection('dados').doc('notas').set({value:state.notas}).catch(()=>{});
      }
      setCloudStatus('☁️ Firebase sincronizado','#22C55E');
    }catch(e){
      console.warn('Firebase load:',e);
      setCloudStatus('⚠️ Sem conexão — dados locais','#F59E0B');
    }
  } else if(SB_URL && SB_URL.length>10){
    setCloudStatus('☁️ Carregando Supabase...','#9CA3AF');
    const ok = await cloudLoad();
    setCloudStatus(ok?'☁️ Supabase sincronizado':'⚠️ Sem conexão — dados locais', ok?'#22C55E':'#F59E0B');
  }
  render();
  // Verificar notificações a cada 60 segundos
  verificarNotificacoes();
  setInterval(verificarNotificacoes, 60000);
}
boot();
window.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeModal(); closeDrawer(); } });
</script>
</body>
</html>
